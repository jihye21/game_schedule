<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game_schedule</title>
    <link rel="stylesheet" href="child.css">
</head>
<body>

    <div class="app-container" style="text-align: center; padding-top: 40px;">
        <header>
            <h1 style="font-size: 26px;">game_schedule</h1>
        </header>

        <!-- 새로 만들기 섹션 -->
        <section style="background: #f1f2f6; padding: 20px; border-radius: 15px; margin-top: 30px;">
            <h2>새로 만들기</h2>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <input type="text" id="newFamilyName" placeholder="집 이름 (예: 철수네 집)" style="padding: 8px; border: 1px solid #dfe6e9; border-radius: 6px; font-size: 13px; flex: 1;">
                <button onclick="createFamily()" style="padding: 8px 12px; background: var(--primary-color); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">생성</button>
            </div>
        </section>
    </div>

    <script src="home.js"></script>
</body>
</html>
