<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game_schedule - 관리 센터</title>
    <link rel="stylesheet" href="parent.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>🛡️ 관리 센터</h1>
        </header>

        <!-- 그룹 선택 및 관리 바 -->
        <div class="group-selector-box" style="display: flex; gap: 6px; margin-bottom: 20px; align-items: center; background: #dfe6e9; padding: 10px; border-radius: 12px; flex-wrap: wrap;">
            <select id="groupSelect" onchange="changeGroup(this.value)" style="flex: 1; min-width: 120px; padding: 6px; border-radius: 6px; border: 1px solid #b2bec3; font-weight: bold; font-size: 13px;">
                <!-- JS 동적 생성 -->
            </select>
            <button onclick="addNewGroup()" style="padding: 6px 8px; font-size: 11px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer;">새 그룹</button>
            <button onclick="copyChildLink()" style="padding: 6px 8px; font-size: 11px; background: #00b894; color: white; border: none; border-radius: 6px; cursor: pointer;">자녀 링크복사</button>
            <button onclick="deleteCurrentGroup()" style="padding: 6px 8px; font-size: 11px; background: #d63031; color: white; border: none; border-radius: 6px; cursor: pointer;">삭제</button>
        </div>

        <!-- 아이 요약 상태 -->
        <div class="status-box">
            <h2>현재 상태</h2>
            <div id="childStatusInfo">
                레벨: Lv.1 | 골드: 0G | 펫: 🥚 귀여운 알
            </div>
        </div>

        <!-- 시간 계획표 관리 -->
        <section>
            <h2>⏰ 오늘의 시간표 관리</h2>
            <div class="add-box">
                <input type="text" id="newScheduleTime" placeholder="시간 (예: 10:00)">
                <input type="text" id="newScheduleTask" placeholder="할 일 입력">
                <button onclick="addScheduleItem()">계획 추가</button>
            </div>
            <div id="parentScheduleList" style="margin-top: 10px;">
                <!-- JS로 동적 생성 -->
            </div>
        </section>

        <!-- 2. 숙제 퀘스트 관리 -->
        <section>
            <h2>⚔️ 오늘의 숙제 관리</h2>
            <div class="add-box">
                <input type="text" id="newQuestTitle" placeholder="숙제 이름">
                <input type="number" id="newQuestExp" placeholder="EXP">
                <input type="number" id="newQuestGold" placeholder="골드">
                <button onclick="addQuestItem()">숙제 추가</button>
            </div>
            <div id="parentQuestManageList" style="margin-top: 10px;">
                <!-- JS로 동적 생성 -->
            </div>
        </section>

        <!-- 3. 숙제 승인 관리 -->
        <section>
            <h2>📋 숙제 확인 목록</h2>
            <div id="parentQuestList">
                <!-- JS로 동적 생성 -->
            </div>
        </section>

        <!-- 4상점 관리 -->
        <section>
            <h2>🎁 상점 관리</h2>
            <div class="add-box">
                <input type="text" id="newItemName" placeholder="아이템 이름 (예: 게임 1시간)">
                <input type="number" id="newItemPrice" placeholder="가격 (골드)">
                <button onclick="addShopItem()">아이템 추가</button>
            </div>
            <div id="parentShopList" style="margin-top: 10px;">
                <!-- JS로 동적 생성 -->
            </div>
        </section>
    </div>

    <script src="parent.js"></script>
</body>
</html>
